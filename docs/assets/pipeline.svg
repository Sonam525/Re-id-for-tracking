<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 352" role="img" aria-label="Pipeline: video, tracker, anonymous segments, crops and embeddings, then an offline identity layer with an anchor pool, a colour filter and mask refinement">

<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill: #24292f; }
  .t { font-size: 14px; font-weight: 600; }
  .d { font-size: 12px; fill: #57606a; }
  .h { font-size: 12px; font-weight: 600; letter-spacing: .04em; fill: #57606a; }
  .box { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
  .box.key { fill: #e8f3ee; stroke: #2f7d5b; }
  .box.input { fill: #fff8e8; stroke: #c98500; stroke-dasharray: 4 3; }
  .band { fill: #f6f8fa; stroke: none; }
  .edge { stroke: #57606a; stroke-width: 1.5; fill: none; }
  .edge.dash { stroke-dasharray: 4 3; }
  .arrow { fill: #57606a; }
  .grid { stroke: #d8dee4; stroke-width: 1; }
  .tr { fill: #2a78d6; } .va { fill: #eb6834; } .tn { fill: #1baf7a; } .te { fill: #eda100; }
  @media (prefers-color-scheme: dark) {
    text { fill: #e6edf3; }
    .d, .h { fill: #9da7b3; }
    .box { fill: #161b22; stroke: #3d444d; }
    .box.key { fill: #12261e; stroke: #4aa37c; }
    .box.input { fill: #2a2110; stroke: #c98500; }
    .band { fill: #11161c; }
    .edge { stroke: #9da7b3; } .arrow { fill: #9da7b3; }
    .grid { stroke: #30363d; }
    .tr { fill: #3987e5; } .va { fill: #d95926; } .tn { fill: #199e70; } .te { fill: #c98500; }
  }
</style>
<rect class="band" x="4" y="8" width="972" height="164" rx="12"/>
<rect class="band" x="4" y="180" width="972" height="164" rx="12"/>
<text class="h" x="20" y="36">PER FRAME, ON A GPU</text>
<text class="h" x="20" y="208">OFFLINE. APPEARANCE NEVER STEERS TRACKING</text>
<rect class="box " x="20" y="56" width="216" height="104" rx="8"/>
<text class="t" x="32" y="79">1  Overhead video</text>
<text class="d" x="32" y="99">2304x1296, one camera,</text>
<text class="d" x="32" y="115">decoded to 5 fps</text>
<rect class="box key" x="264" y="56" width="216" height="104" rx="8"/>
<text class="t" x="276" y="79">2  Tracker</text>
<text class="d" x="276" y="99">SAM 3 with a distilled</text>
<text class="d" x="276" y="115">TinyViT student. RF-DETR</text>
<text class="d" x="276" y="131">detector re-seeds it</text>
<rect class="box " x="508" y="56" width="216" height="104" rx="8"/>
<text class="t" x="520" y="79">3  Anonymous segments</text>
<text class="d" x="520" y="99">One RLE mask per frame.</text>
<text class="d" x="520" y="115">No identity yet</text>
<rect class="box " x="752" y="56" width="216" height="104" rx="8"/>
<text class="t" x="764" y="79">4  Crops, embeddings</text>
<text class="d" x="764" y="99">Masked crops every 15 s,</text>
<text class="d" x="764" y="115">DINOv3 ViT-S/16</text>
<rect class="box input" x="20" y="228" width="216" height="104" rx="8"/>
<text class="t" x="32" y="251">Anchor pool</text>
<text class="d" x="32" y="271">30,588 verified crops</text>
<text class="d" x="32" y="287">from 04-18 and 04-19</text>
<rect class="box key" x="264" y="228" width="216" height="104" rx="8"/>
<text class="t" x="276" y="251">5  Identity layer</text>
<text class="d" x="276" y="271">3-min windows, Hungarian</text>
<text class="d" x="276" y="287">match over runs. Says</text>
<text class="d" x="276" y="303">'?' when unsure</text>
<rect class="box " x="508" y="228" width="216" height="104" rx="8"/>
<text class="t" x="520" y="251">6  Colour filter</text>
<text class="d" x="520" y="271">Hides tracks that are</text>
<text class="d" x="520" y="287">not a black and white</text>
<text class="d" x="520" y="303">calf</text>
<rect class="box " x="752" y="228" width="216" height="104" rx="8"/>
<text class="t" x="764" y="251">7  Mask refinement</text>
<text class="d" x="764" y="271">Detector repairs mask</text>
<text class="d" x="764" y="287">fragments. Identity</text>
<text class="d" x="764" y="303">does not change</text>
<path class="edge" d="M236 108 L256 108"/><polygon class="arrow" points="264,108 256,104 256,112"/>
<path class="edge" d="M480 108 L500 108"/><polygon class="arrow" points="508,108 500,104 500,112"/>
<path class="edge" d="M724 108 L744 108"/><polygon class="arrow" points="752,108 744,104 744,112"/>
<path class="edge" d="M860 160 L860 176 L372 176 L372 220"/><polygon class="arrow" points="372,228 368,220 376,220"/>
<path class="edge dash" d="M236 280 L256 280"/><polygon class="arrow" points="264,280 256,276 256,284"/>
<path class="edge" d="M480 280 L500 280"/><polygon class="arrow" points="508,280 500,276 500,284"/>
<path class="edge" d="M724 280 L744 280"/><polygon class="arrow" points="752,280 744,276 744,284"/>
</svg>